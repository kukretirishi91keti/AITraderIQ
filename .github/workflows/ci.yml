name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit/integration tests (exclude slow load tests and e2e)
        env:
          DEMO_MODE: "true"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: pytest tests/ -v --tb=short --cov=. --cov-report=term-missing -m "not slow and not e2e"

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start backend server
        env:
          DEMO_MODE: "true"
          JWT_SECRET_KEY: "ci-e2e-secret-key-minimum-32-chars"
          DATABASE_URL: "sqlite+aiosqlite:///./e2e_test.db"
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8765 --log-level warning &
          echo $! > /tmp/uvicorn.pid

      - name: Wait for server to be healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8765/api/health > /dev/null 2>&1; then
              echo "Server is up"
              exit 0
            fi
            echo "Waiting... ($i/20)"
            sleep 1
          done
          echo "Server did not start in time"
          exit 1

      - name: Run E2E workflow tests
        env:
          DEMO_MODE: "true"
          JWT_SECRET_KEY: "ci-e2e-secret-key-minimum-32-chars"
          DATABASE_URL: "sqlite+aiosqlite:///./e2e_test.db"
        run: pytest tests/test_trader_workflow_e2e.py -v --tb=short --timeout=30 -m "e2e"

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then
            kill $(cat /tmp/uvicorn.pid) 2>/dev/null || true
          fi

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, backend-e2e, frontend-lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t traderai-backend ./backend

      - name: Build frontend image
        run: docker build -t traderai-frontend ./frontend
