name: Pre-Launch Acceptance Test

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Render backend URL"
        required: false
        default: "https://aitraderiq.onrender.com"
      frontend_url:
        description: "Netlify frontend URL"
        required: false
        default: "https://aitraderiq.netlify.app"

jobs:
  # ── Job 1: Full backend unit + integration tests ──────────────────────────
  backend-suite:
    name: Backend Test Suite (DEMO mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all backend tests
        env:
          DEMO_MODE: "true"
          JWT_SECRET_KEY: "ci-test-secret-not-for-production"
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_smoke_1000_users.py \
            --ignore=tests/test_smoke_50_users.py \
            -m "not slow" \
            2>&1 | tee /tmp/pytest-output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest-output.txt

  # ── Job 2: 4-Trader workflow tests via live API ───────────────────────────
  trader-workflow-tests:
    name: 4-Trader Live API Workflows
    runs-on: ubuntu-latest
    needs: backend-suite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install httpx
        run: pip install httpx pytest pytest-asyncio

      - name: Run 4-trader workflow tests against live API
        env:
          API_BASE: ${{ github.event.inputs.api_url }}
        run: |
          python -m pytest .github/tests/test_live_trader_workflows.py \
            -v --tb=short \
            2>&1 | tee /tmp/live-test-output.txt

      - name: Upload live test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: /tmp/live-test-output.txt

  # ── Job 3: Live smoke test (shell script) ────────────────────────────────
  smoke-test:
    name: Live Smoke Test
    runs-on: ubuntu-latest
    needs: backend-suite

    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test against Render
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh "${{ github.event.inputs.api_url }}"

  # ── Job 4: Frontend build check ──────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Confirm bundle size reasonable
        run: |
          SIZE=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${SIZE}KB"
          [ "$SIZE" -lt 5000 ] || (echo "Bundle too large: ${SIZE}KB > 5MB" && exit 1)

  # ── Job 5: Summary ────────────────────────────────────────────────────────
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-suite, trader-workflow-tests, smoke-test, frontend-build]
    if: always()

    steps:
      - name: Report overall result
        run: |
          echo "============================================"
          echo "  AITraderIQ Pre-Launch Test Summary"
          echo "============================================"
          echo "  Backend Suite   : ${{ needs.backend-suite.result }}"
          echo "  Trader Workflows: ${{ needs.trader-workflow-tests.result }}"
          echo "  Smoke Test      : ${{ needs.smoke-test.result }}"
          echo "  Frontend Build  : ${{ needs.frontend-build.result }}"
          echo "============================================"

          if [[ \
            "${{ needs.backend-suite.result }}"       == "success" && \
            "${{ needs.trader-workflow-tests.result }}" == "success" && \
            "${{ needs.smoke-test.result }}"          == "success" && \
            "${{ needs.frontend-build.result }}"      == "success" \
          ]]; then
            echo "  RESULT: ALL PASS — READY TO GO LIVE"
            exit 0
          else
            echo "  RESULT: FAILURES FOUND — DO NOT MERGE TO MAIN YET"
            exit 1
          fi
