[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
markers =
    slow: marks tests as slow (excluded from default CI run)
    integration: marks integration tests requiring external services
    api: marks API tests
    e2e: marks end-to-end tests requiring a live server (handled by e2e-test CI job)

