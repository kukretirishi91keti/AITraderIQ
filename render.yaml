services:
  - type: web
    name: traderai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 30
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://aitraderiq.netlify.app
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false  # Set in Render dashboard: postgresql+asyncpg://neondb_owner:PASSWORD@ep-holy-morning-ao6v1ghx.c-2.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GROQ_API_KEY
        sync: false  # Set in Render dashboard - free key at console.groq.com
      - key: TWELVE_DATA_API_KEY
        sync: false  # Set in Render dashboard - twelvedata.com ($8/mo, India/NSE primary)
      - key: FINNHUB_API_KEY
        sync: false  # Set in Render dashboard - finnhub.io (free, US stocks + news)
      - key: SENDGRID_API_KEY
        sync: false  # Set in Render dashboard - sendgrid.com (free 100/day, price alert emails)
      - key: ALERT_FROM_EMAIL
        sync: false  # Set in Render dashboard - verified sender email in SendGrid (e.g. alerts@yourdomain.com)
